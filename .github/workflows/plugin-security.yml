name: Plugin security

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: zui-lightsail-validation-20260927
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify reviewed scanner exceptions
        run: sha256sum --check --strict .github/plugin-scan-reviewed.sha256
      - name: Prepare report directory
        run: mkdir -p test-results
      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@55616c962cf86368423f7673b2ecdfdbe613d1af # v1.2.515
        with:
          plugin_dir: .
          min_score: 80
          fail_on_severity: high
          format: json
          output: test-results/plugin-scan.json
          pr_comment: off
      - name: Preserve scan details on runner
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preserve-results.sh plugin-scan test-results/plugin-scan.json
