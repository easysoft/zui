name: Plugin security

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plugin-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify reviewed scanner exceptions
        run: sha256sum --check --strict .github/plugin-scan-reviewed.sha256
      - name: Scan plugin
        uses: hashgraph-online/ai-plugin-scanner-action@55616c962cf86368423f7673b2ecdfdbe613d1af # v1.2.515
        with:
          plugin_dir: .
          min_score: 80
          fail_on_severity: high
          format: json
          output: ${{ runner.temp }}/plugin-scan.json
          pr_comment: off
      - name: Upload scan details
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: plugin-scan
          path: ${{ runner.temp }}/plugin-scan.json
          if-no-files-found: ignore
          retention-days: 14
