name: Main and nightly checks

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=2048

permissions:
  contents: read

concurrency:
  group: main-nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and coverage
    runs-on: zui-lightsail-validation-20260927
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependency security
        run: pnpm audit --audit-level=high

      - name: Run lint and type checks
        run: pnpm lint && pnpm typecheck

      - name: Run skills tests
        run: pnpm test:skills

      - name: Run tests with coverage
        run: pnpm test:coverage --maxWorkers=1 --no-file-parallelism

      - name: Preserve coverage on runner
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preserve-results.sh quality coverage

  distributions:
    name: Distribution contracts and full build
    needs: quality
    runs-on: zui-lightsail-validation-20260927
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify representative distributions
        run: pnpm test:build

      - name: Verify npm package artifact files
        run: |
          test -s test-results/npm-package/artifact.json
          test -s test-results/npm-package/*.tgz

      - name: Build the complete distribution
        run: pnpm build --name zui --out-dir dist/zui --exclude-not-ready

      - name: Verify complete distribution files
        run: |
          test -s dist/zui/zui.js
          test -s dist/zui/zui.esm.js
          test -s dist/zui/zui.css

      - name: Preserve distributions on runner
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preserve-results.sh distributions test-results/npm-package dist/zui

  browsers:
    name: Chromium, Firefox and WebKit browser contracts
    needs: distributions
    runs-on: zui-lightsail-validation-20260927
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium, Firefox and WebKit
        run: pnpm exec playwright install chromium firefox webkit

      - name: Run all browser checks
        env:
          PLAYWRIGHT_SKIP_VISUAL: '1'
        run: pnpm test:e2e:all --workers=1 --fail-on-flaky-tests

      - name: Preserve browser diagnostics on runner
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preserve-results.sh browsers playwright-report test-results/playwright

  docs:
    name: Build documentation for deployment
    needs: [quality, distributions, browsers]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: zui-lightsail-validation-20260927
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          check-latest: true
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: BASE_PATH=/zui/3/ pnpm docs:build
      - name: Install Chromium for documentation checks
        run: pnpm exec playwright install chromium
      - name: Verify documentation examples
        run: BASE_PATH=/zui/3/ pnpm test:docs --workers=1 --fail-on-flaky-tests
      - name: Preserve verified documentation and diagnostics on runner
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preserve-results.sh docs docs/_/.vitepress/dist playwright-report/docs test-results/docs
