name: Lightsail runner validation
run-name: Lightsail Firefox WebGL environment verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightsail-runner-validation
  cancel-in-progress: false

jobs:
  probe:
    runs-on: zui-lightsail-validation-20260927
    timeout-minutes: 10
    env:
      CI: 'true'
      PLAYWRIGHT_ALL_BROWSERS: '1'
      PLAYWRIGHT_SKIP_VISUAL: '1'
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0bbc93aa26719d3b05f3149b6b307a07c3f63cd8
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 12.5.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile

      - name: Compare Firefox WebGL support with and without Xvfb
        run: |
          cat > "$RUNNER_TEMP/firefox-webgl.cjs" <<'JS'
          const {firefox} = require(process.env.GITHUB_WORKSPACE + '/node_modules/@playwright/test');
          (async () => {
            const headless = process.env.HEADLESS === 'true';
            const browser = await firefox.launch({headless});
            try {
              const page = await browser.newPage();
              const contexts = await page.evaluate(() => Object.fromEntries(
                ['webgl', 'webgl2'].map(type => [type, Boolean(document.createElement('canvas').getContext(type))])
              ));
              console.log(JSON.stringify({headless, ...contexts}));
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
          HEADLESS=true node "$RUNNER_TEMP/firefox-webgl.cjs"
          HEADLESS=false xvfb-run --auto-servernum node "$RUNNER_TEMP/firefox-webgl.cjs"

      - name: Recheck the failed Firefox background test under Xvfb
        run: |
          xvfb-run --auto-servernum pnpm exec playwright test tests/e2e/dev-catalog.spec.ts \
            --project=firefox --grep 'renders the background' --headed --workers=1 --retries=0 --fail-on-flaky-tests

      - name: Measure the slow Firefox rendering case with a diagnostic timeout
        if: ${{ !cancelled() }}
        run: |
          pnpm exec playwright test tests/e2e/list-limit.spec.ts:26 \
            --project=firefox --workers=1 --retries=0 --timeout=120000 --fail-on-flaky-tests

      - name: Preserve Firefox probe diagnostics on the VPS
        if: always()
        run: |
          result="$HOME/validation-results/$GITHUB_RUN_ID"
          mkdir -p "$result"
          tar -czf "$result/firefox-probe.tar.gz" playwright-report test-results
