name: Lightsail runner validation
run-name: Lightsail runner smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightsail-runner-validation
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: zui-lightsail-validation-20260927
    timeout-minutes: 10
    steps:
      - name: Verify runner dispatch and isolation
        run: |
          set -euo pipefail
          test "$(id -un)" = gh-runner
          test ! -r /etc/x-ui/x-ui.db
          id
          uname -m
          free -m
          printf 'GitHub dispatched a job to the Singapore VPS.\n' | tee "$RUNNER_TEMP/lightsail-smoke.txt"
          cat /sys/fs/cgroup/system.slice/zui-runner-validation.service/memory.max
          cat /sys/fs/cgroup/system.slice/zui-runner-validation.service/cpu.max

      - name: Check out the current main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 0bbc93aa26719d3b05f3149b6b307a07c3f63cd8
          persist-credentials: false

      - name: Verify artifact upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lightsail-runner-smoke
          path: ${{ runner.temp }}/lightsail-smoke.txt
          if-no-files-found: error
          retention-days: 1
