name: PR checks

on:
  pull_request:
  workflow_dispatch:

env:
  NODE_OPTIONS: --max-old-space-size=2048

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Quality and coverage
    runs-on: zui-lightsail-validation-20260927
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependency security
        run: pnpm audit --audit-level=high

      - name: Run static and skills checks
        run: pnpm lint && pnpm typecheck && pnpm test:skills

      - name: Run tests with coverage
        run: pnpm test:coverage --maxWorkers=1 --no-file-parallelism

      - name: Preserve coverage on runner
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preserve-results.sh quality coverage

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Distribution and documentation builds
    needs: quality
    runs-on: zui-lightsail-validation-20260927
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify representative distributions
        run: pnpm test:build

      - name: Verify npm package artifact files
        run: |
          test -s test-results/npm-package/artifact.json
          test -s test-results/npm-package/*.tgz

      - name: Build documentation
        run: pnpm docs:build
      - name: Install Chromium for documentation checks
        run: pnpm exec playwright install chromium
      - name: Verify documentation examples
        run: pnpm test:docs --workers=1 --fail-on-flaky-tests
      - name: Preserve distributions and documentation diagnostics on runner
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preserve-results.sh build test-results/npm-package playwright-report/docs test-results/docs

  browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Chromium browser contracts
    needs: build
    runs-on: zui-lightsail-validation-20260927
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.10.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          check-latest: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install chromium

      - name: Run Chromium browser checks
        env:
          PLAYWRIGHT_SKIP_VISUAL: '1'
        run: pnpm test:e2e --workers=1 --fail-on-flaky-tests

      - name: Preserve browser diagnostics on runner
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preserve-results.sh browser playwright-report test-results/playwright
