name: Deploy Dev
on:
  push:
    branches:
      - dev

env:
  NODE_OPTIONS: --max-old-space-size=2048

permissions:
  contents: read

concurrency:
  group: deploy-docs-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: zui-lightsail-validation-20260927
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.5.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          check-latest: true
      - run: pnpm install --frozen-lockfile
      - name: Audit dependency security
        run: pnpm audit --audit-level=high
      - name: Verify source changes
        run: pnpm lint && pnpm typecheck && pnpm test --maxWorkers=1 --no-file-parallelism && pnpm test:skills
      - name: Build
        run: BASE_PATH=/zui/dev/ pnpm docs:build
      - name: Install Chromium for documentation checks
        run: pnpm exec playwright install chromium
      - name: Verify documentation examples
        run: BASE_PATH=/zui/dev/ pnpm test:docs --workers=1 --fail-on-flaky-tests
      - name: Preserve verified documentation and diagnostics on runner
        if: ${{ !cancelled() }}
        run: bash scripts/ci/preserve-results.sh dev-docs docs/_/.vitepress/dist playwright-report/docs test-results/docs

  deploy:
    needs: build
    permissions:
      contents: write
    runs-on: zui-lightsail-validation-20260927
    timeout-minutes: 10
    steps:
      - name: Read verified documentation from this run
        run: |
          zui_results="$HOME/zui-ci-results/$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/dev-docs"
          test "$(cat "$zui_results/commit")" = "$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/zui-docs"
          tar -xzf "$zui_results/results.tar.gz" -C "$RUNNER_TEMP/zui-docs" docs/_/.vitepress/dist
      - name: Deploy
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/zui-docs/docs/_/.vitepress/dist
          destination_dir: dev
