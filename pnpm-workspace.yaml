packages:
  - "dev"
  - "lib/**"
  - "docs"
  - "!build"
  - "!exts"
allowBuilds:
  esbuild: true
overrides:
  # Keep the legacy transforms on the patched PostCSS API used by the build.
  "postcss-inset@1.0.0>postcss": "^8.5.28"
  "postcss-rem-to-pixel@4.1.2>postcss": "^8.5.28"
  # VitePress 1.x pins an unsupported Vite 5; plugin-vue 5 supports Vite 6.
  "vitepress@1.6.4>vite": "6.4.3"
patchedDependencies:
  # Backport runtime depth guards from micromatch/braces#72 (not yet released).
  # https://github.com/micromatch/braces/pull/72/commits/28d440b5dd449dbf1fe6f3506cf94ecca4d02660
  braces@3.0.3: patches/braces@3.0.3.patch
  # Preserve plugin behavior while aligning their declarations with MarkdownIt 14.
  "markdown-it-anchor@8.6.7": "patches/markdown-it-anchor@8.6.7.patch"
  "markdown-it-toc-done-right@4.2.0": "patches/markdown-it-toc-done-right@4.2.0.patch"
audit:
  ignore:
    # Patched above; pnpm audit matches versions without inspecting local patches.
    # Regression coverage: tests/unit/braces-security.test.ts.
    # ZUI maintainers: review by 2026-11-04; remove this exception and patch when a fixed release is adopted.
    - GHSA-vfj7-8cjw-p6xm
